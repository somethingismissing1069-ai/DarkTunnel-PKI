[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securevault-pki"
version = "0.1.0"
description = "Open-source PKI cryptographic toolkit for digital signatures, encryption, and certificate management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "coverage>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
securevault = "securevault.securevault_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["securevault"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
